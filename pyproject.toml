[project]
name = "word-mcp"
version = "0.3.0"
description = "MCP server that measures and fixes .docx layout with Word (macOS, Windows) or LibreOffice (Linux)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-2.0-only" }
dependencies = ["fastmcp>=2.0"]

[project.optional-dependencies]
windows = ["pywin32>=306"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
word-mcp = "wordmcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wordmcp"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
# Engines implement DocumentEngine; the contract is documented once on the base class.
"wordmcp/engines/*.py" = ["D102"]

[tool.pytest.ini_options]
testpaths = ["tests"]
